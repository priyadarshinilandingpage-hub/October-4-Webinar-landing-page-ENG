# Firebase App Hosting: https://firebase.google.com/docs/app-hosting/configure
#
# FIRST DEPLOY works as it is: the page goes live, and the ₹99 form says "Registration is temporarily
# unavailable" until the Cashfree keys are added (step 2). Nothing here is secret: secrets live in Cloud
# Secret Manager and are only referenced by name.
#
# STEP 1, right after the backend is created: set SITE_URL below to the backend's address
#   (https://<backend>--<project>.<region>.hosted.app, shown in the App Hosting console), later to your
#   custom domain. Push, and App Hosting rolls out again.
#
# STEP 2, when you have the Cashfree keys (sandbox first): create each secret with the Firebase CLI. The CLI
#   asks to grant the backend access: say yes.
#     firebase apphosting:secrets:set CASHFREE_CLIENT_ID
#     firebase apphosting:secrets:set CASHFREE_CLIENT_SECRET
#     firebase apphosting:secrets:set WEBINAR_WHATSAPP_URL
#     firebase apphosting:secrets:set RESEND_API_KEY
#     firebase apphosting:secrets:set META_CAPI_TOKEN
#   Then uncomment the matching blocks in the "Secrets" part below and push. A referenced secret that
#   doesn't exist makes the rollout fail, so only uncomment the ones you created.
#
# Firestore needs nothing here: on App Hosting the site finds its project and uses the backend's own
# service account. Create the Firestore database (Native mode, asia-south1) and publish firestore.rules.
# If saving still fails with 403 in the logs, give the backend's service account the "Cloud Datastore
# User" role in Google Cloud IAM.

runConfig:
  minInstances: 0 # set to 1 while ads are running, so the first visitor never waits for a cold start
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Plain config (not secret) ─────────────────────────────────────────────
  - variable: CASHFREE_ENV
    value: sandbox # switch to production at go-live, together with the production keys
    availability: [RUNTIME]
  - variable: SITE_URL
    value: https://REPLACE-WITH-YOUR-DOMAIN.in # STEP 1: must match the address in the browser exactly
    availability: [RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  # Confirmation email sender, on a domain verified in Resend (needed with RESEND_API_KEY).
  # - variable: EMAIL_FROM
  #   value: "Priyadharsini Webinar <webinar@REPLACE-WITH-YOUR-DOMAIN.in>"
  #   availability: [RUNTIME]
  # Meta Pixel: the same number twice. NEXT_PUBLIC_ one is needed at BUILD (it is written into the page).
  # - variable: NEXT_PUBLIC_META_PIXEL_ID
  #   value: "000000000000000"
  #   availability: [BUILD, RUNTIME]
  # - variable: META_PIXEL_ID
  #   value: "000000000000000"
  #   availability: [RUNTIME]
  # Meta Business Manager domain verification code (meta-tag method).
  # - variable: META_DOMAIN_VERIFICATION
  #   value: "REPLACE"
  #   availability: [RUNTIME]

  # ── Secrets (Cloud Secret Manager), runtime only so they never reach the build ──
  # STEP 2: uncomment each block after creating its secret.
  # - variable: CASHFREE_CLIENT_ID
  #   secret: CASHFREE_CLIENT_ID
  #   availability: [RUNTIME]
  # - variable: CASHFREE_CLIENT_SECRET
  #   secret: CASHFREE_CLIENT_SECRET
  #   availability: [RUNTIME]
  # Buyers-only WhatsApp group link (kept out of the repo on purpose).
  # - variable: WEBINAR_WHATSAPP_URL
  #   secret: WEBINAR_WHATSAPP_URL
  #   availability: [RUNTIME]
  # Resend API key (confirmation email).
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability: [RUNTIME]
  # Meta Conversions API token.
  # - variable: META_CAPI_TOKEN
  #   secret: META_CAPI_TOKEN
  #   availability: [RUNTIME]
  # Optional: shared rate limiting across instances.
  # - variable: UPSTASH_REDIS_REST_URL
  #   value: https://REPLACE-WITH-YOUR-DB.upstash.io
  #   availability: [RUNTIME]
  # - variable: UPSTASH_REDIS_REST_TOKEN
  #   secret: UPSTASH_REDIS_REST_TOKEN
  #   availability: [RUNTIME]
