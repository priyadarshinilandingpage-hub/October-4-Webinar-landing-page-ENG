# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render asks for every `sync: false` value on first deploy
# (they are stored in Render, never in this file).
services:
  - type: web
    name: priyadharsini-webinar
    runtime: node
    region: singapore # closest Render region to India
    plan: starter # free instances sleep and cold-start; not suitable for paid ad traffic
    buildCommand: npm ci && npm run build
    # `next start` listens on $PORT (set by Render) and 0.0.0.0 by default.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Do NOT set NODE_ENV here: `npm ci` would then skip the devDependencies the build needs.
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CASHFREE_ENV
        value: sandbox # switch to production at go-live
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        sync: false
      - key: SITE_URL
        sync: false # e.g. https://your-domain.in (must match the browser address)
      - key: WEBINAR_WHATSAPP_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_TOKEN
        sync: false
      - key: META_TEST_EVENT_CODE
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      - key: META_DOMAIN_VERIFICATION
        sync: false
      # Firestore (registrations table + already-paid list): from a service-account key JSON.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Resend (confirmation email).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
